<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Quran Checksum Explorer</title>
    <script>
      // GitHub Pages serves no server-side routing, so a direct visit to a
      // client-side route such as /quran-checksum/natural-patterns lands here
      // instead of on the app. Stash the requested path in the query string
      // and bounce to the app root; index.html puts it back.
      var pathSegmentsToKeep = 1; // the /quran-checksum/ project base
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
